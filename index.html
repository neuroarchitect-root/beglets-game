<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>БЕГЛЕЦ — Конвой</title>
<style>html,body{margin:0;height:100%;background:#090b10;overflow:hidden;font-family:monospace}body{display:flex;align-items:center;justify-content:center}#w{position:relative;width:min(100vw,1280px);aspect-ratio:16/9;background:#000;box-shadow:0 0 40px #000}canvas{width:100%;height:100%;image-rendering:pixelated;background:#10141d}#crt{pointer-events:none;position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.08),rgba(0,0,0,.08) 1px,transparent 1px,transparent 3px)}</style></head>
<body><div id="w"><canvas id="g" width="320" height="180"></canvas><div id="crt"></div></div>
<script>
const c=document.getElementById('g'),x=c.getContext('2d');x.imageSmoothingEnabled=false;
const K={};addEventListener('keydown',e=>{K[e.code]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault()});addEventListener('keyup',e=>K[e.code]=false);
const C={sky:'#111826',road:'#2b2d35',steel:'#596171',light:'#bfc6d4',skin:'#d59b6e',kimble:'#526b88',guard:'#7a704d',red:'#b64046',yellow:'#d8a84c',green:'#4d8b63',black:'#090b10',white:'#e7e2d6',rain:'#6b7892'};
let state='TITLE',t=0,phaseT=0,shake=0,msg='',qte=0,qteTarget=.25,guardSaved=false,alert=0,trainX=350,px=48;
const rain=[];for(let i=0;i<120;i++)rain.push({x:Math.random()*320,y:Math.random()*180,s:1+Math.random()*2});
function reset(s){state=s;phaseT=0;msg=''}
function rect(a,b,w,h,col){x.fillStyle=col;x.fillRect(a|0,b|0,w|0,h|0)}
function text(s,a,b,col=C.white,sz=8,align='left'){x.fillStyle=col;x.font=sz+'px monospace';x.textAlign=align;x.fillText(s,a,b)}
function rainFx(){x.strokeStyle=C.rain;x.lineWidth=1;for(const r of rain){x.beginPath();x.moveTo(r.x,r.y);x.lineTo(r.x-2,r.y+5);x.stroke();r.y+=r.s*1.7;r.x-=.7;if(r.y>185){r.y=-5;r.x=Math.random()*330}}}
function busBody(off=0){rect(35+off,58,250,74,'#303a48');rect(41+off,64,238,60,'#3c4655');for(let i=0;i<6;i++){rect(51+i*35+off,69,24,20,'#182233');rect(53+i*35+off,71,20,16,'#1d2d40')}rect(46+off,124,228,8,'#1d2229');for(let i=0;i<2;i++){x.fillStyle='#14171c';x.beginPath();x.arc(85+i*150+off,136,12,0,Math.PI*2);x.fill();x.fillStyle='#68717f';x.beginPath();x.arc(85+i*150+off,136,5,0,Math.PI*2);x.fill()}}
function human(a,b,col=C.kimble,dir=1){rect(a-3,b-17,7,9,C.skin);rect(a-4,b-8,9,12,col);rect(a-3,b+4,3,7,'#202631');rect(a+2,b+4,3,7,'#202631');rect(a+(dir>0?4:-6),b-6,3,8,C.skin)}
function hud(obj){rect(5,5,310,20,'#0a0d12');text('МИССИЯ 3 — КОНВОЙ',10,13,C.yellow,7);text(obj,10,22,C.white,7);if(alert>0){rect(248,10,60,4,'#251519');rect(248,10,60*Math.min(1,alert/100),4,C.red);text('ТРЕВОГА',248,22,C.red,6)}}
function title(){rect(0,0,320,180,C.black);for(let i=0;i<180;i+=4)rect(0,i,320,1,'#0d1320');text('БЕГЛЕЦ',160,68,C.white,24,'center');text('МИССИЯ 3',160,90,C.yellow,9,'center');text('КОНВОЙ',160,105,C.white,14,'center');if((t/35|0)%2===0)text('НАЖМИ ENTER',160,145,C.light,8,'center');if(K.Enter){K.Enter=false;reset('BUS')}}
function bus(){rect(0,0,320,180,C.sky);rect(0,145,320,35,C.road);for(let i=0;i<12;i++)rect(i*38-(phaseT*1.8)%38,154,20,2,'#737780');busBody();rainFx();human(105,112,C.kimble);human(145,112,'#654f46');human(185,112,'#4e5d47');human(248,112,C.guard,-1);hud('Осмотритесь. Конвой движется через ночной лес.');if(phaseT>120)text('Q — наблюдение',12,168,C.light,7);if(K.KeyQ){text('КЛЮЧИ',244,91,C.yellow,6);text('АПТЕЧКА',210,117,C.yellow,6);text('МОЛОТОК',65,91,C.yellow,6)}if(phaseT>360)reset('CRASH')}
function crash(){rect(0,0,320,180,C.sky);rect(0,145,320,35,C.road);let o=Math.sin(phaseT*.35)*Math.min(18,phaseT*.09);x.save();x.rotate(Math.min(.55,phaseT*.004));busBody(o);x.restore();rainFx();for(let i=0;i<18;i++){let ex=160+Math.sin(i*7+phaseT*.2)*phaseT*.35,ey=95+Math.cos(i*4+phaseT*.16)*phaseT*.12;rect(ex,ey,2,2,i%2?C.yellow:C.white)}if(phaseT<35)text('ВОДИТЕЛЬ: ДЕРЖИТЕСЬ!',160,25,C.white,8,'center');if(phaseT>60)shake=8;if(phaseT>105)reset('QTE')}
function qteScene(){rect(0,0,320,180,'#141923');busBody(-35);rainFx();human(143,137,C.kimble);hud('Освободитесь от наручников.');text('НАРУЧНИКИ',160,44,C.white,10,'center');rect(80,54,160,10,'#191c22');rect(82,56,156,6,'#343b47');let zoneX=92+qteTarget*120;rect(zoneX,55,24,8,C.green);let cursor=82+(Math.sin(phaseT*.12)+1)*78;rect(cursor,53,3,12,C.yellow);text('Нажимай E, когда метка внутри зелёной зоны',160,82,C.light,7,'center');text('УСПЕХ: '+qte+'/3',160,96,C.yellow,8,'center');if(K.KeyE){K.KeyE=false;if(cursor>=zoneX&&cursor<=zoneX+24){qte++;qteTarget=Math.random()}else{alert=Math.min(100,alert+12);msg='Слишком шумно!'}}if(msg)text(msg,160,112,C.red,7,'center');if(qte>=3&&phaseT>30)reset('GUARD')}
function guardChoice(){rect(0,0,320,180,C.sky);rect(0,132,320,48,'#252a31');busBody(-110);rainFx();human(120,143,C.kimble);human(205,151,C.guard);hud('Раненый охранник зажат обломками.');text('ОХРАННИК: Помоги...',205,126,C.white,6,'center');rect(18,145,120,25,'#35475d');rect(182,145,120,25,'#181d25');text('E — СПАСТИ',78,160,C.white,8,'center');text('F — УЙТИ',242,160,C.white,8,'center');if(K.KeyE){K.KeyE=false;guardSaved=true;reset('STEALTH')}if(K.KeyF){K.KeyF=false;guardSaved=false;reset('STEALTH')}}
function worldBase(){rect(0,0,320,180,C.sky);rect(0,136,320,44,'#252a31');for(let i=0;i<16;i++){let xx=i*28-(phaseT*.22)%28;rect(xx,130,3,16,'#4e5560');rect(xx-4,142,20,3,'#535863')}rect(0,128,320,3,'#6a6f77');rect(0,145,320,3,'#555b65');for(let i=0;i<8;i++){rect(i*45,102,28,28,'#202832');rect(i*45+3,106,22,8,'#293544')}rainFx()}
function stealth(){worldBase();let speed=(K.ShiftLeft||K.ShiftRight)?1.35:.7;if(K.KeyD||K.ArrowRight)px+=speed;if(K.KeyA||K.ArrowLeft)px-=speed;px=Math.max(10,Math.min(310,px));human(px,139,C.kimble);let copX=235+Math.sin(phaseT*.025)*42;human(copX,139,'#263b59',-1);rect(copX-60,118,60,1,'#705f3f');let dist=Math.abs(px-copX);if(dist<65&&px<copX)alert=Math.min(100,alert+.45*((K.ShiftLeft||K.ShiftRight)?2:1));else alert=Math.max(0,alert-.3);hud('Доберитесь до грузового поезда. Не попадитесь полиции.');text('A/D — движение   SHIFT — бег',10,170,C.light,6);if(alert>=100){px=48;alert=25;msg='Вас заметили! Попробуйте снова.'}if(msg)text(msg,160,35,C.red,7,'center');if(px>298)reset('TRAIN')}
function train(){rect(0,0,320,180,C.sky);rect(0,144,320,36,'#232831');rainFx();trainX-=1.2;if(trainX<-40)trainX=340;for(let i=0;i<5;i++){let xx=trainX+i*66;rect(xx,86,58,46,i%2?'#55523f':'#475264');rect(xx+4,91,50,28,'#2b333e');rect(xx+10,120,38,6,'#24282e')}human(px,142,C.kimble);if(K.KeyD||K.ArrowRight)px+=1;if(K.KeyA||K.ArrowLeft)px-=1;hud('Запрыгните на поезд.');text('SPACE — прыжок',12,170,C.light,7);if(K.Space&&Math.abs(px-(trainX+8))<28){K.Space=false;reset('ROOF');px=35}}
function roof(){rect(0,0,320,180,C.sky);rainFx();for(let i=0;i<6;i++){let xx=i*64-(phaseT*1.4)%64;rect(xx,125,58,28,'#414a57');rect(xx+4,129,50,18,'#2b333e')}human(px,124,C.kimble);let sp=K.ShiftLeft?1.4:.9;if(K.KeyD)px+=sp;if(K.KeyA)px-=sp;hud('Бегите по составу. Перепрыгивайте разрывы.');text('D — вперёд   SHIFT — бег   SPACE — прыжок',12,170,C.light,6);if(px>280)reset('JUMP')}
function jumpScene(){rect(0,0,320,180,C.sky);rect(0,145,320,35,'#27303a');rainFx();let p=Math.min(1,phaseT/100),xx=40+p*220,yy=118-Math.sin(p*Math.PI)*48;human(xx,yy,C.kimble);text('ПРЫЖОК',160,45,C.white,14,'center');if(phaseT>110)reset('RADIO')}
function radio(){rect(0,0,320,180,'#10151c');rect(28,42,264,108,'#242b34');rect(42,54,95,80,'#303945');rect(175,74,70,45,'#191e25');rect(184,82,52,28,'#313843');for(let i=0;i<5;i++)rect(189+i*10,88,5,12,'#11151a');human(108,137,C.kimble,-1);if(phaseT<130){text('РАДИО:',160,28,C.yellow,8,'center');text('Разыскивается сбежавший заключённый',160,40,C.white,7,'center');text('Ричард Кимбл.',160,51,C.white,7,'center')}else if(phaseT<290){text('РАДИО:',160,28,C.red,8,'center');text('Предположительно вооружён и опасен.',160,45,C.white,8,'center')}else{text('СТАТУС: БЕГЛЕЦ',160,40,C.red,12,'center');text(guardSaved?'Охранник спасён.':'Охранник оставлен.',160,58,C.light,7,'center');text('ENTER — завершить миссию',160,162,C.white,7,'center');if(K.Enter){K.Enter=false;reset('END')}}}
function end(){rect(0,0,320,180,C.black);text('МИССИЯ ЗАВЕРШЕНА',160,65,C.white,14,'center');text('РИЧАРД КИМБЛ',160,90,C.yellow,10,'center');text('СТАТУС: БЕГЛЕЦ',160,108,C.red,9,'center');text('Следующая миссия: БОЛЬНИЦА КАУНТИ',160,140,C.light,7,'center')}
function loop(){t++;phaseT++;x.save();if(shake>0){x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.92}({TITLE:title,BUS:bus,CRASH:crash,QTE:qteScene,GUARD:guardChoice,STEALTH:stealth,TRAIN:train,ROOF:roof,JUMP:jumpScene,RADIO:radio,END:end}[state]||title)();x.restore();requestAnimationFrame(loop)}loop();
</script></body></html>
